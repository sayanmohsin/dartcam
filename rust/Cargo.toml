[package]
name = "rust_lib_local_dart_scorer"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
flutter_rust_bridge = "=2.12.0"
thingd-core = { version = "0.31.0", features = ["sqlite"] }
serde_json = "1.0"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
